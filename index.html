<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NMOS Simple Tools — Open-source broadcast utilities for ST 2110 / NMOS IS-04 and IS-05 environments.">
  <title>NMOS Simple Tools</title>
  <script>
    (function () {
      var lang = (navigator.language || navigator.userLanguage || '').toLowerCase();
      window.location.replace(lang.startsWith('ja') ? 'ja/' : 'en/');
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090b0f;
      color: #eceef2;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 32px;
    }
    p { color: #858c9a; font-size: 13px; letter-spacing: 0.05em; }
    .btns { display: flex; gap: 12px; }
    a {
      color: #00d2a0;
      text-decoration: none;
      font-size: 13px;
      font-family: monospace;
      letter-spacing: 0.08em;
      border: 1px solid rgba(0,210,160,0.3);
      padding: 10px 24px;
      transition: background 0.2s;
    }
    a:hover { background: rgba(0,210,160,0.08); }
  </style>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
  <p>Redirecting… / リダイレクト中…</p>
  <div class="btns">
    <a href="en/">English</a>
    <a href="ja/">日本語</a>
  </div>
</body>
</html>
