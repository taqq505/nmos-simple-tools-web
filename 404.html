<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>NMOS Simple Tools</title>
  <script>
    (function () {
      var BASE = '/nmos-simple-tools-web/';
      var path = window.location.pathname;
      var rest = path.indexOf(BASE) === 0 ? path.slice(BASE.length) : path.replace(/^\//, '');

      // Bare URL missing the /ja/ or /en/ prefix (old link, guessed URL, etc.)
      // — redirect into the right language, keeping the rest of the path intact.
      if (rest && !/^(ja|en)(\/|$)/.test(rest)) {
        var lang = (navigator.language || navigator.userLanguage || '').toLowerCase().indexOf('ja') === 0 ? 'ja' : 'en';
        window.location.replace(BASE + lang + '/' + rest + window.location.search + window.location.hash);
      }
      // Otherwise this is a genuine 404 — #msg is visible by default in the markup below,
      // since this script runs in <head> before <body> exists and can't safely touch it.
    })();
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090b0f;
      color: #eceef2;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
      text-align: center;
      padding: 24px;
    }
    h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
    p { color: #858c9a; font-size: 13px; letter-spacing: 0.03em; }
    .btns { display: flex; gap: 12px; margin-top: 16px; }
    a {
      color: #00d2a0;
      text-decoration: none;
      font-size: 13px;
      font-family: monospace;
      letter-spacing: 0.08em;
      border: 1px solid rgba(0,210,160,0.3);
      padding: 10px 24px;
      transition: background 0.2s;
    }
    a:hover { background: rgba(0,210,160,0.08); }
  </style>
  <link rel="icon" href="/nmos-simple-tools-web/favicon.svg" type="image/svg+xml">
</head>
<body>
  <div id="msg">
    <h1>404 — Page Not Found / ページが見つかりません</h1>
    <p>The page you're looking for doesn't exist. / お探しのページは見つかりませんでした。</p>
    <div class="btns">
      <a href="/nmos-simple-tools-web/en/">English</a>
      <a href="/nmos-simple-tools-web/ja/">日本語</a>
    </div>
  </div>
</body>
</html>
