<!DOCTYPE html>
<html lang="ja" class="lang-ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>スクロール試作 — NMOS Simple RDS Mirror</title>
  <link rel="stylesheet" href="../../../assets/css/common.css">
  <link rel="icon" href="../../../favicon.svg" type="image/svg+xml">
  <style>
    html, body {
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
    }

    .deck {
      position: relative;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    .deck__bar {
      flex-shrink: 0;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-3);
    }
    .deck__bar a { color: var(--text-2); text-decoration: none; }
    .deck__bar a:hover { color: var(--grad-from); }
    .deck__bar-right { display: flex; align-items: center; gap: 16px; }
    .deck__counter { color: var(--text-2); }

    .deck__progress-track {
      flex-shrink: 0;
      height: 3px;
      background: var(--border);
    }
    .deck__progress-fill {
      height: 100%;
      width: 5%;
      background: linear-gradient(90deg, var(--grad-from), var(--grad-to));
      transition: width .4s ease;
    }

    .deck__stage {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 14px clamp(16px, 5vw, 64px) 10px;
      min-height: 0;
    }

    /* フレームは常に画像と同じ比率(1360:860)固定 — %指定のクリック枠がズレないように */
    .deck__frame {
      position: relative;
      width: min(100%, 1080px, calc((100dvh - 190px) * 1.581));
      aspect-ratio: 1360 / 860;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-md), 0 30px 70px rgba(0,0,0,0.14);
      overflow: hidden;
      background: #0b0d12;
      flex-shrink: 0;
    }
    .deck__frame > * { position: absolute; inset: 0; }
    .deck__frame img#stage-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      will-change: opacity, transform;
    }

    /* クリック箇所を示す枠+番号バッジ */
    .deck__callout {
      position: absolute;
      border: 2px solid var(--grad-from);
      border-radius: 8px;
      box-shadow: 0 0 0 3px rgba(14,165,233,0.22), 0 0 20px rgba(14,165,233,0.4);
      pointer-events: none;
      z-index: 3;
    }
    .deck__callout__badge {
      position: absolute;
      top: -13px; left: -13px;
      width: 26px; height: 26px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--grad-from), var(--grad-to));
      color: #fff;
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }

    /* タイトル・エンドスライド用 */
    .deck__title-slide {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 14px;
      color: #fff;
      background:
        radial-gradient(circle at 30% 20%, rgba(14,165,233,0.35), transparent 55%),
        radial-gradient(circle at 75% 75%, rgba(124,58,237,0.35), transparent 55%),
        #0b0d12;
      padding: 20px;
    }
    .deck__title-slide.is-visible { display: flex; }
    .deck__title-slide img.deck__icon { width: 48px; height: 48px; }
    .deck__title-slide h1 {
      font-family: var(--font-display);
      font-size: clamp(22px, 3.6vw, 38px);
      font-weight: 800;
    }
    .deck__title-slide p { font-size: 13.5px; opacity: 0.75; max-width: 460px; }
    .deck__title-slide .deck__cta-row { display: flex; gap: 12px; margin-top: 6px; }
    .deck__title-slide .deck__pill {
      font-family: var(--font-mono);
      font-size: 11px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 999px;
      padding: 5px 12px;
      opacity: 0.85;
    }
    .deck__hint {
      margin-top: 4px;
      font-size: 12px;
      opacity: 0.6;
      animation: deck-bob 1.6s ease-in-out infinite;
    }
    @keyframes deck-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(6px); }
    }

    .deck__end-links { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
    .deck__end-links a {
      font-family: var(--font-mono);
      font-size: 12.5px;
      color: #fff;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 999px;
      padding: 8px 16px;
      transition: background .2s ease;
    }
    .deck__end-links a:hover { background: rgba(255,255,255,0.12); }
    .deck__end-links a.is-primary {
      background: linear-gradient(135deg, var(--grad-from), var(--grad-to));
      border-color: transparent;
    }

    /* 前へ/次へ — フレームの角に固定し、キャプション文と絶対に重ならない */
    .deck__arrow {
      position: absolute;
      width: 32px; height: 32px;
      border-radius: 50%;
      border: none;
      background: rgba(15,23,42,0.55);
      backdrop-filter: blur(4px);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      z-index: 6;
      transition: opacity .2s ease, background .2s ease;
    }
    .deck__arrow:hover { background: rgba(15,23,42,0.8); }
    .deck__arrow--up { top: 12px; right: 12px; }
    .deck__arrow--down { bottom: 12px; right: 12px; }
    .deck__arrow[disabled] { opacity: 0.2; cursor: default; pointer-events: none; }

    .deck__caption {
      flex-shrink: 0;
      width: 100%;
      max-width: 760px;
      text-align: center;
      min-height: 56px;
    }
    .deck__eyebrow {
      font-family: var(--font-mono);
      font-size: 10.5px;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--grad-from);
      margin-bottom: 4px;
    }
    .deck__caption-title {
      font-family: var(--font-display);
      font-size: 16.5px;
      font-weight: 700;
      color: var(--text-1);
      margin-bottom: 4px;
    }
    .deck__caption-body {
      font-size: 13px;
      color: var(--text-2);
      line-height: 1.6;
    }
    .deck__caption-body b { color: var(--text-1); }

    .deck__dots {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      padding: 6px 0 4px;
      max-width: 90vw;
    }
    .deck__dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--border-mid);
      border: none;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
      transition: background .25s ease, transform .25s ease;
    }
    .deck__dot.is-current {
      background: linear-gradient(135deg, var(--grad-from), var(--grad-to));
      transform: scale(1.5);
    }

    @keyframes deck-shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
    .deck__frame.is-shaking { animation: deck-shake .3s ease; }

    @media (max-width: 640px) {
      .deck__caption-body { font-size: 12.5px; }
    }
  </style>
</head>
<body>

  <div class="deck" id="deck">
    <div class="deck__bar">
      <span>NMOS// Simple Tools / RDS Mirror — <span style="color:var(--text-1)">スクロール試作</span></span>
      <div class="deck__bar-right">
        <span class="deck__counter" id="counter">1 / 18</span>
        <a href="../tutorial/">通常版</a>
        <a href="../">製品ページ</a>
      </div>
    </div>

    <div class="deck__progress-track">
      <div class="deck__progress-fill" id="progress-fill"></div>
    </div>

    <div class="deck__stage">
      <div class="deck__frame" id="frame">
        <div class="deck__title-slide is-visible" id="title-slide">
          <img class="deck__icon" src="../../../assets/icons/rds-mirror.svg" alt="">
          <h1>RDS Mirror チュートリアル</h1>
          <p>2つのRDSを登録し、リソースをミラーして詳細を確認するまで。スクロール1回で1ステップ進みます。</p>
          <div class="deck__cta-row">
            <span class="deck__pill">全16ステップ</span>
            <span class="deck__pill">約2分</span>
          </div>
          <p class="deck__hint">↓ スクロールして開始</p>
        </div>

        <img id="stage-img" alt="">
        <div id="callouts"></div>

        <div class="deck__title-slide" id="end-slide">
          <h1>お疲れさまでした</h1>
          <p>ここまでの流れで、RDSの登録からPassthrough / Transformミラー、出自の確認、連鎖ミラーガードまで一通り触れました。</p>
          <div class="deck__end-links">
            <a class="is-primary" href="https://github.com/taqq505/nmos-simple-rds-mirror/releases" target="_blank" rel="noopener">ダウンロード ↗</a>
            <a href="../tutorial/">通常版チュートリアルを見る</a>
            <a href="../">製品ページへ戻る</a>
          </div>
          <p class="deck__hint">↑ スクロールで戻る</p>
        </div>

        <button type="button" class="deck__arrow deck__arrow--up" id="btn-up" aria-label="前へ" disabled>↑</button>
        <button type="button" class="deck__arrow deck__arrow--down" id="btn-down" aria-label="次へ">↓</button>
      </div>

      <div class="deck__caption" id="caption">
        <p class="deck__eyebrow" id="cap-eyebrow"></p>
        <p class="deck__caption-title" id="cap-title"></p>
        <p class="deck__caption-body" id="cap-body"></p>
      </div>

      <div class="deck__dots" id="dots"></div>
    </div>
  </div>

  <script src="../../../assets/js/common.js"></script>
  <script>
    (function () {
      var IMG = '../../../assets/images/rds-mirror-tutorial/';

      var SLIDES = [
        { kind: 'title' },

        { kind: 'shot', img: IMG + 'dashboard.png',
          eyebrow: 'FLOW 01 — 起動直後',
          title: 'Dashboardで全体を確認',
          body: '上段のカードで件数を、下段でRDSごとの到達性とジョブ一覧を確認できる。次は左の<b>Mirror</b>へ進む。',
          callouts: [{ left:0.88, top:14.97, width:13.46, height:4.37 }] },

        { kind: 'shot', img: IMG + 'registry-one.png',
          eyebrow: 'FLOW 02 — RDS Registry (1/3)',
          title: 'RDS Registryを開く',
          body: 'STUDIO-Aが1件だけ登録された状態。右上の <b>+ Add registry</b> から2件目を追加する。',
          callouts: [{ left:89.29, top:3.26, width:8.36, height:3.84 }] },

        { kind: 'shot', img: IMG + 'registry-add-form.png',
          eyebrow: 'FLOW 02 — RDS Registry (2/3)',
          title: '名前とURLを入力',
          body: '<b>Label</b>に分かりやすい名前(例: STUDIO-B)、<b>Query API URL</b>と<b>Registration API URL</b>に宛先RDSのアドレスを入力し、<b>Save</b>を押す。',
          callouts: [
            { left:38.16, top:40.6,  width:23.68, height:4.07 },
            { left:38.16, top:48.47, width:23.68, height:4.07 },
            { left:38.16, top:56.34, width:23.68, height:4.07 },
            { left:38.16, top:61.8,  width:23.68, height:3.84 }
          ] },

        { kind: 'shot', img: IMG + 'registry-two.png',
          eyebrow: 'FLOW 02 — RDS Registry (3/3)',
          title: '登録完了',
          body: 'STUDIO-A / STUDIO-Bの2件が揃った。これでミラー元・先が用意できた。' },

        { kind: 'shot', img: IMG + 'mirror-source.png',
          eyebrow: 'FLOW 03 — Mirror workspace (1/4)',
          title: 'SOURCEを選ぶ',
          body: 'SOURCEのプルダウンでSTUDIO-Aを選ぶと、ノード・デバイスごとにリソースが一覧表示される。',
          callouts: [{ left:19.04, top:18.34, width:24.4, height:4.07 }] },

        { kind: 'shot', img: IMG + 'mirror-dest.png',
          eyebrow: 'FLOW 03 — Mirror workspace (2/4)',
          title: 'DESTINATIONを選ぶ',
          body: 'DESTINATIONのプルダウンでSTUDIO-Bを選ぶ。この時点では右側はまだ空。',
          callouts: [{ left:71.85, top:18.34, width:24.4, height:4.07 }] },

        { kind: 'shot', img: IMG + 'mirror-select-resource.png',
          eyebrow: 'FLOW 03 — Mirror workspace (3/4)',
          title: 'リソースを選んでコピー',
          body: 'ミラーしたい行(CAM-1 Video)をクリックして選択し、<b>Copy selection</b>を押す。',
          callouts: [
            { left:21.4,  top:55.19, width:19.7,  height:3.93 },
            { left:49.93, top:14.74, width:15.44, height:9.77 }
          ] },

        { kind: 'shot', img: IMG + 'mirror-copied.png',
          eyebrow: 'FLOW 03 — Mirror workspace (4/4)',
          title: 'ミラー完了',
          body: '右側に登録され、接続線が引かれる。線の中央のアイコンをクリックすると次のTransform設定に進める。',
          callouts: [{ left:56.54, top:51.02, width:2.21, height:3.49 }] },

        { kind: 'shot', img: IMG + 'transform-filled.png',
          eyebrow: 'FLOW 04 — Transform config (1/3)',
          title: 'IPとportを入力',
          body: 'Transformタブに切り替え、宛先のIPとportを入力する。',
          callouts: [
            { left:51.03, top:52.28, width:11.03, height:4.07 },
            { left:62.5,  top:52.28, width:5.29,  height:4.07 }
          ] },

        { kind: 'shot', img: IMG + 'transform-preview.png',
          eyebrow: 'FLOW 04 — Transform config (2/3)',
          title: 'SDPをプレビュー',
          body: '<b>Preview SDP / active JSON</b>を押すと、保存前に実際の配信内容を確認できる。',
          callouts: [{ left:30.81, top:71.21, width:38.38, height:4.07 }] },

        { kind: 'shot', img: IMG + 'transform-saved.png',
          eyebrow: 'FLOW 04 — Transform config (3/3)',
          title: 'Transform完了',
          body: 'Saveすると宛先に「RDS Mirror Proxy」仮想デバイスが作られ、点線の接続線でTransformだと分かる。' },

        { kind: 'shot', img: IMG + 'detail-original.png',
          eyebrow: 'FLOW 05 — Resource detail (1/2)',
          title: 'ORIGINALの詳細',
          body: '行をダブルクリックすると詳細が開く。<b>ORIGINAL</b>はこのRDSにネイティブに登録されたリソース。' },

        { kind: 'shot', img: IMG + 'detail-mirrored.png',
          eyebrow: 'FLOW 05 — Resource detail (2/2)',
          title: 'TRANSFORM (PROXY)の詳細',
          body: '<b>TRANSFORM (PROXY)</b>— どのジョブ・どのRDSからミラーされたかが分かる。' },

        { kind: 'shot', img: IMG + 'chain-guard.png',
          eyebrow: 'FLOW 06 — Chain-mirror guard (1/3)',
          title: '連鎖ミラーはブロックされる',
          body: 'ミラーされてきたリソースには「mirrored-in」「chain blocked」の印が付く。試しにクリックしてみる。',
          callouts: [{ left:21.4, top:49.23, width:19.7, height:3.93 }] },

        { kind: 'shot', img: IMG + 'chain-guard-toast.png',
          eyebrow: 'FLOW 06 — Chain-mirror guard (2/3)',
          title: '理由がトーストで分かる',
          body: 'クリックすると、ブロックされている理由と設定変更方法を説明するトーストが出る。' },

        { kind: 'shot', img: IMG + 'jobs-page.png',
          eyebrow: 'FLOW 06 — Chain-mirror guard (3/3)',
          title: 'Jobsで状態を確認',
          body: 'Jobsページで、動いているジョブの有効/無効・ハートビートをまとめて確認できる。' },

        { kind: 'end' }
      ];

      var LAST = SLIDES.length - 1;
      var current = 0;
      var locked = false;

      var frame = document.getElementById('frame');
      var stageImg = document.getElementById('stage-img');
      var calloutsWrap = document.getElementById('callouts');
      var titleSlide = document.getElementById('title-slide');
      var endSlide = document.getElementById('end-slide');
      var caption = document.getElementById('caption');
      var capEyebrow = document.getElementById('cap-eyebrow');
      var capTitle = document.getElementById('cap-title');
      var capBody = document.getElementById('cap-body');
      var dotsWrap = document.getElementById('dots');
      var progressFill = document.getElementById('progress-fill');
      var counter = document.getElementById('counter');
      var btnUp = document.getElementById('btn-up');
      var btnDown = document.getElementById('btn-down');

      SLIDES.forEach(function (_, i) {
        var dot = document.createElement('button');
        dot.type = 'button';
        dot.className = 'deck__dot';
        dot.addEventListener('click', function () { goTo(i); });
        dotsWrap.appendChild(dot);
      });
      var dots = Array.prototype.slice.call(dotsWrap.children);

      function renderCallouts(s) {
        calloutsWrap.innerHTML = '';
        if (!s.callouts) return;
        s.callouts.forEach(function (c, i) {
          var box = document.createElement('div');
          box.className = 'deck__callout';
          box.style.left = c.left + '%';
          box.style.top = c.top + '%';
          box.style.width = c.width + '%';
          box.style.height = c.height + '%';
          var badge = document.createElement('span');
          badge.className = 'deck__callout__badge';
          badge.textContent = String(i + 1);
          box.appendChild(badge);
          calloutsWrap.appendChild(box);
        });
      }

      function render(step) {
        var s = SLIDES[step];

        titleSlide.classList.toggle('is-visible', s.kind === 'title');
        endSlide.classList.toggle('is-visible', s.kind === 'end');
        stageImg.style.display = s.kind === 'shot' ? 'block' : 'none';
        caption.style.visibility = s.kind === 'shot' ? 'visible' : 'hidden';

        if (s.kind === 'shot') {
          stageImg.src = s.img;
          capEyebrow.textContent = s.eyebrow;
          capTitle.textContent = s.title;
          capBody.innerHTML = s.body;
          renderCallouts(s);
        } else {
          calloutsWrap.innerHTML = '';
        }

        dots.forEach(function (d, i) { d.classList.toggle('is-current', i === step); });
        progressFill.style.width = ((step + 1) / SLIDES.length * 100) + '%';
        counter.textContent = (step + 1) + ' / ' + SLIDES.length;
        btnUp.disabled = step === 0;
        btnDown.disabled = step === LAST;
      }

      function shakeBoundary() {
        frame.classList.remove('is-shaking');
        void frame.offsetWidth;
        frame.classList.add('is-shaking');
      }

      function elsFor(step) {
        var s = SLIDES[step];
        if (s.kind === 'shot') return [stageImg, calloutsWrap, caption];
        if (s.kind === 'title') return [titleSlide];
        return [endSlide];
      }

      function goTo(next) {
        if (locked || next === current) return;
        if (next < 0 || next > LAST) { shakeBoundary(); return; }
        locked = true;

        var dir = next > current ? 1 : -1;
        var outEls = elsFor(current);

        outEls.forEach(function (el) {
          el.style.transition = 'opacity .28s ease, transform .28s ease';
          el.style.opacity = '0';
          el.style.transform = 'translateY(' + (-dir * 22) + 'px) scale(0.985)';
        });

        setTimeout(function () {
          current = next;
          render(current);

          var inEls = elsFor(current);
          inEls.forEach(function (el) {
            el.style.transition = 'none';
            el.style.opacity = '0';
            el.style.transform = 'translateY(' + (dir * 22) + 'px) scale(1.015)';
          });
          void frame.offsetWidth;

          requestAnimationFrame(function () {
            inEls.forEach(function (el) {
              el.style.transition = 'opacity .38s cubic-bezier(.22,.68,0,1), transform .38s cubic-bezier(.22,.68,0,1)';
              el.style.opacity = '1';
              el.style.transform = 'translateY(0) scale(1)';
            });
          });

          setTimeout(function () { locked = false; }, 380);
        }, 260);
      }

      // ── 1 wheel tick = 1 step ──
      var wheelCooldown = false;
      window.addEventListener('wheel', function (e) {
        e.preventDefault();
        if (locked || wheelCooldown) return;
        if (Math.abs(e.deltaY) < 6) return;
        wheelCooldown = true;
        setTimeout(function () { wheelCooldown = false; }, 250);
        goTo(current + (e.deltaY > 0 ? 1 : -1));
      }, { passive: false });

      // ── touch swipe ──
      var touchStartY = null;
      window.addEventListener('touchstart', function (e) { touchStartY = e.touches[0].clientY; }, { passive: true });
      window.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
      window.addEventListener('touchend', function (e) {
        if (touchStartY === null) return;
        var dy = touchStartY - e.changedTouches[0].clientY;
        touchStartY = null;
        if (Math.abs(dy) < 40) return;
        goTo(current + (dy > 0 ? 1 : -1));
      }, { passive: true });

      // ── keyboard ──
      document.addEventListener('keydown', function (e) {
        if (['ArrowDown', 'PageDown', ' '].indexOf(e.key) !== -1) { e.preventDefault(); goTo(current + 1); }
        else if (['ArrowUp', 'PageUp'].indexOf(e.key) !== -1) { e.preventDefault(); goTo(current - 1); }
      });

      btnUp.addEventListener('click', function () { goTo(current - 1); });
      btnDown.addEventListener('click', function () { goTo(current + 1); });

      render(0);
    })();
  </script>
</body>
</html>
